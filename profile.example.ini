; Профиль сборки «Мост». Скопируйте в profile.ini и впишите свои данные.
; profile.ini и enroll_key в git НЕ попадают (.gitignore) — там ваши адреса и ключ регистрации.
[main]
rel = версия 104.4
; update_url = https://ваш-сайт/путь/ryadom   ; кнопка «Обновить»: рядом лежат ryadom.exe и ryadom.txt («103.9 SHA256»); пусто — обновления выключены
; имя программы в окне и журнале
app_name = Мост
; строка под именем в окне (необязательно), например: для ИИ Агента
;app_sub = для ИИ Агента
; имя задачи автозапуска окна при входе в Windows (по умолчанию «<имя> окно»)
;auto_task = Мост окно
; свой значок программы (.ico), путь от папки сборки
;icon = theme\most.ico
; надписи состояния в окне; по умолчанию «<имя> открыт / закрыт / открывается»
; имя другого рода — свои слова, например для «Рядом»: Мы рядом / Доступ закрыт / Подключаемся…
;state_on = Мост открыт
;state_off = Мост закрыт
;state_busy = Мост открывается
; Radmin VPN тихой установкой (необязательно; пусто — не ставится). Запускается только при верной контрольной сумме.
; radmin_url = https://ваш-сайт/Radmin_VPN.exe
; radmin_sha256 = КОНТРОЛЬНАЯ_СУММА_SHA256
; RustDesk первым шагом установки (необязательно; пусто — не ставится).
; Файл качается по ссылкам через «|» по очереди, запускается только при верной контрольной сумме и подписи RustDesk (PURSLANE).
; rustdesk_url = https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe
; rustdesk_sha256 = 8555777215510d83d2d61c9dc984e4fcc838bd7e79f9d18a42585431f5e8bb47
; свой сервер RustDesk (hbbs/hbbr): адрес, ретрансляция, публичный ключ; rustdesk_config — строка для rustdesk.exe --config
; rustdesk_host = 203.0.113.30:21116
; rustdesk_relay = 203.0.113.30:21117
; rustdesk_key = ВАШ_ПУБЛИЧНЫЙ_КЛЮЧ
; rustdesk_config =
; адрес и порт вашего сервера туннелей (отдельный sshd, см. server/README.md)
host = 203.0.113.10
port = 22022
; как сервер называется в текстах окна: «Связь с сервером поддержки», «Туннель до сервера поддержки»
srv_name = поддержки
; имя сервера в known_hosts клиента (любое латиницей)
host_alias = tunnelsrv
tunnel_user = claude_tunnel
enroll_user = claude_enroll
; кто обслуживает — строка в шапке окна
org = ваша служба поддержки 1С
; имя задачи в Планировщике и файла журнала на рабочем столе клиента
task_name = Claude туннель
journal = Журнал доступа Claude.txt
; как в журнале подписан вход через туннель
tunnel_from = через туннель (сервер поддержки)
; папка с установщиком OpenSSH-Win64-v9.5.0.0.msi (для ПК, где SSH не ставится из Windows)
files_url = https://example.com/files
; запасной скрипт установки SSH (необязательно)
ssh_fallback_url = https://example.com/ssh-setup.txt
; файл с закрытым ключом регистрации (создаётся по server/README.md, шаг 3)
enroll_key_file = enroll_key
; ссылка на открытый код в окне программы
source_url = https://github.com/89040617240mm21-a11y/tunnel-claude

[hostkeys]
; отпечатки сервера: строки из ssh-keyscan -p 22022 203.0.113.10, имя в начале заменить на host_alias
line = tunnelsrv ssh-ed25519 ВСТАВЬТЕ_ОТКРЫТЫЙ_КЛЮЧ_СЕРВЕРА

[key.1]
; открытые ключи специалистов (только часть после «ssh-ed25519 »), которые смогут входить на ПК клиента
blob = ВСТАВЬТЕ_ОТКРЫТЫЙ_КЛЮЧ_СПЕЦИАЛИСТА
label = специалист: офис

; серверы, до которых окно меряет пинг; tcp — порт для проверки «Связь с сервером» (0 — только пинг)
; flag: ru, ge, fi или пусто
[server.1]
name = Сервер поддержки
ip = 203.0.113.10
radmin =
tcp = 22022
flag = ru
label = сервер поддержки

[server.2]
name = Офис специалистов
ip = 203.0.113.20
radmin =
tcp = 0
flag =
label = офис специалистов
