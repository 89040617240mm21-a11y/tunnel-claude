; Профиль сборки «Туннель Claude». Скопируйте в profile.ini и впишите свои данные.
; profile.ini и enroll_key в git НЕ попадают (.gitignore) — там ваши адреса и ключ регистрации.
[main]
rel = версия 102
; адрес и порт вашего сервера туннелей (отдельный sshd, см. server/README.md)
host = 203.0.113.10
port = 22022
; как сервер называется в текстах окна: «Связь с сервером поддержки», «Туннель до сервера поддержки»
srv_name = поддержки
; имя сервера в known_hosts клиента (любое латиницей)
host_alias = tunnelsrv
tunnel_user = claude_tunnel
enroll_user = claude_enroll
; кто обслуживает — строка в шапке окна
org = ваша служба поддержки 1С
; имя задачи в Планировщике и файла журнала на рабочем столе клиента
task_name = Claude туннель
journal = Журнал доступа Claude.txt
; как в журнале подписан вход через туннель
tunnel_from = через туннель (сервер поддержки)
; папка с установщиком OpenSSH-Win64-v9.5.0.0.msi (для ПК, где SSH не ставится из Windows)
files_url = https://example.com/files
; запасной скрипт установки SSH (необязательно)
ssh_fallback_url = https://example.com/ssh-setup.txt
; файл с закрытым ключом регистрации (создаётся по server/README.md, шаг 3)
enroll_key_file = enroll_key

[hostkeys]
; отпечатки сервера: строки из ssh-keyscan -p 22022 203.0.113.10, имя в начале заменить на host_alias
line = tunnelsrv ssh-ed25519 ВСТАВЬТЕ_ОТКРЫТЫЙ_КЛЮЧ_СЕРВЕРА

[key.1]
; открытые ключи специалистов (только часть после «ssh-ed25519 »), которые смогут входить на ПК клиента
blob = ВСТАВЬТЕ_ОТКРЫТЫЙ_КЛЮЧ_СПЕЦИАЛИСТА
label = специалист: офис

; серверы, до которых окно меряет пинг; tcp — порт для проверки «Связь с сервером» (0 — только пинг)
; flag: ru, ge, fi или пусто
[server.1]
name = Сервер поддержки
ip = 203.0.113.10
radmin =
tcp = 22022
flag = ru
label = сервер поддержки

[server.2]
name = Офис специалистов
ip = 203.0.113.20
radmin =
tcp = 0
flag =
label = офис специалистов
